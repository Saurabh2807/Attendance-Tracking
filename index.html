<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Attendance Tracking">
    <title>Attendance Tracking</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-overall: #0c142b;
            --card-surface: #19233f;
            --primary: #468df9;
            --accent-toggle: #5be9a6;
            --danger: #ff5c5c;
            --success: #6fe4a7;
            --text-main: #ffffff;
            --text-dim: #9ca3af;
            --border: #2c3859;
            --bg-night: linear-gradient(180deg, #101c40 0%, #0d1223 60%, #0c142b 100%);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-overall); color: var(--text-main);
            padding-bottom: 80px; overflow-x: hidden;
            background-image: var(--bg-night); background-size: cover;
            background-attachment: fixed; min-height: 100vh;
        }
        header { padding: 25px 20px 15px; backdrop-filter: blur(5px); border-bottom: 1px solid var(--border); }
        h1 { margin: 0; font-size: 1.5rem; letter-spacing: -0.5px; }
        .sub-header { color: var(--text-dim); font-size: 0.85rem; margin-top: 4px; display: flex; align-items: center; gap: 10px; }
        .change-btn { font-size: 0.7rem; padding: 2px 10px; border-radius: 20px; background: rgba(70,141,249,0.15); color: var(--primary); border: 1px solid rgba(70,141,249,0.3); cursor: pointer; font-family: inherit; font-weight: 600; }
        nav { position: fixed; bottom: 0; width: 100%; background: rgba(12,20,43,0.95); backdrop-filter: blur(15px); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--border); z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-dim); font-size: 0.7rem; cursor: pointer; transition: color 0.2s; }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 1.4rem; margin-bottom: 4px; }
        .container { padding: 20px; max-width: 600px; margin: 0 auto; }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        #section-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 30px; }
        #section-screen h2 { font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; text-align: center; }
        #section-screen p { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 40px; text-align: center; line-height: 1.6; }
        .sec-btn { width: 100%; max-width: 340px; padding: 20px; border-radius: 20px; border: 1px solid var(--border); background: rgba(25,35,63,0.9); color: white; font-family: inherit; cursor: pointer; margin-bottom: 16px; transition: all 0.2s; text-align: left; }
        .sec-btn:active { transform: scale(0.97); }
        .sec-btn .st { font-size: 1.2rem; font-weight: 700; }
        .sec-btn .ss { font-size: 0.8rem; color: var(--text-dim); margin-top: 4px; }
        .sec-btn.a4 { border-color: rgba(70,141,249,0.4); }
        .sec-btn.a4 .st { color: var(--primary); }
        .sec-btn.b11 { border-color: rgba(91,233,166,0.4); }
        .sec-btn.b11 .st { color: var(--accent-toggle); }

        .card { background: rgba(25,35,63,0.85); border-radius: 20px; padding: 20px; margin-bottom: 16px; border: 1px solid var(--border); box-shadow: 0 4px 30px rgba(0,0,0,0.3); }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .stat-card { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; text-align: center; }
        .stat-val { display: block; font-size: 1.4rem; font-weight: 700; color: var(--primary); }
        .stat-label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; }
        .subj-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .subj-name { font-weight: 600; font-size: 1rem; }
        .tag { font-size: 0.65rem; padding: 4px 9px; border-radius: 6px; text-transform: uppercase; font-weight: 700; }
        .tag-theory { background: rgba(70,141,249,0.2); color: #80b3fc; }
        .tag-lab { background: rgba(147,51,234,0.2); color: #d1c4e9; }
        .tag-ml { background: rgba(156,163,175,0.2); color: #9ca3af; }
        .prog-wrap { height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; margin: 10px 0; overflow: hidden; }
        .prog-bar { height: 100%; transition: width 0.5s ease; border-radius: 5px; }

        input[type="date"] { width: 100%; background: var(--bg-overall); border: 1px solid var(--border); color: white; padding: 12px; border-radius: 12px; font-family: inherit; margin-bottom: 15px; font-size: 0.9rem; color-scheme: dark; }
        button { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.2s; }
        button:active { transform: scale(0.98); }
        .btn-p { background: var(--primary); color: white; margin-bottom: 10px; }
        .btn-save { background: var(--primary); color: white; margin-top: 20px; font-weight: 700; }
        .period-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--border); }
        .period-info { flex: 1; }
        .period-name { font-weight: 500; font-size: 0.95rem; }
        .period-pts { font-size: 0.75rem; color: var(--text-dim); }
        .tog-grp { display: flex; background: rgba(255,255,255,0.05); border-radius: 10px; padding: 4px; }
        .tog-btn { padding: 7px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: 0.2s; color: var(--text-dim); background: none; border: none; font-family: inherit; }
        .tog-btn.active.p { background: var(--accent-toggle); color: #0c142b; }
        .tog-btn.active.a { background: var(--danger); color: white; }
        .tog-btn.active.r { background: rgba(255,255,255,0.15); color: white; }
        .calc-row { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 5px; }
        .calc-val { font-weight: 600; }
        .alert-box { padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-top: 10px; text-align: center; font-weight: 500; }
        .alert-safe { background: rgba(91,233,166,0.1); color: var(--success); border: 1px solid rgba(91,233,166,0.2); }
        .alert-danger { background: rgba(255,92,92,0.1); color: var(--danger); border: 1px solid rgba(255,92,92,0.2); }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { text-align: left; color: var(--text-dim); padding: 10px; border-bottom: 1px solid var(--border); }
        td { padding: 10px; border-bottom: 1px solid var(--border); }
        select { width: 100%; background: #19233f; color: white; border: 1px solid var(--border); padding: 12px; border-radius: 12px; margin-bottom: 15px; font-family: inherit; font-size: 0.9rem; -webkit-appearance: none; appearance: none; }
        select option { background: #19233f; color: white; }
        #app { display: none; }
    </style>
</head>
<body>

<div id="section-screen">
    <h2>Attendance Tracking</h2>
    <p>B.Tech II Semester • LNCT Bhopal<br>Apna section select karo</p>
    <button class="sec-btn a4" onclick="selectSection('A4')">
        <div class="st">Section A-4</div>
        <div class="ss">LNCTE • CSE • Set A</div>
    </button>
    <button class="sec-btn b11" onclick="selectSection('B11')">
        <div class="st">Section B-11</div>
        <div class="ss">LNCT&S • AIML • Set B</div>
    </button>
</div>

<div id="app">
    <header>
        <h1>Attendance Tracking</h1>
        <div class="sub-header">
            <span id="sec-label"></span>
            <button class="change-btn" onclick="changeSection()">Change</button>
        </div>
    </header>
    <div class="container">
        <div id="tab-overview" class="tab-content active">
            <div class="stat-grid">
                <div class="stat-card"><span class="stat-label">Total Classes</span><span class="stat-val">525</span></div>
                <div class="stat-card"><span class="stat-label">Overall %</span><span id="overall-perc" class="stat-val">0%</span></div>
                <div class="stat-card"><span class="stat-label">Classes Held</span><span id="overall-held" class="stat-val">0</span></div>
                <div class="stat-card"><span class="stat-label">Attended</span><span id="overall-attended" class="stat-val">0</span></div>
            </div>
            <div id="subject-cards-container"></div>
        </div>

        <div id="tab-mark" class="tab-content">
            <div class="card">
                <label style="display:block;margin-bottom:8px;font-size:0.8rem;color:var(--text-dim)">Select Date</label>
                <input type="date" id="date-picker">
                <button class="btn-p" onclick="loadDay()">Load Schedule</button>
                <div id="day-ui" style="display:none;margin-top:20px;">
                    <div style="display:flex;gap:8px;margin-bottom:20px;">
                        <button style="background:rgba(91,233,166,0.15);color:var(--accent-toggle);font-size:0.8rem;" onclick="markAll('p')">All Present</button>
                        <button style="background:rgba(255,92,92,0.15);color:var(--danger);font-size:0.8rem;" onclick="markAll('a')">All Absent</button>
                        <button style="background:rgba(255,255,255,0.07);color:var(--text-dim);font-size:0.8rem;" onclick="markAll('r')">Reset All</button>
                    </div>
                    <div id="period-list"></div>
                    <button class="btn-save" onclick="saveAtt()">Save Attendance</button>
                </div>
                <div id="holiday-msg" style="display:none;text-align:center;padding:40px 20px;color:var(--text-dim);"></div>
            </div>
        </div>

        <div id="tab-subjects" class="tab-content">
            <select id="sub-filter" onchange="renderSubjectLogs()"></select>
            <div class="card" style="padding:10px;overflow-x:auto;">
                <table><thead><tr><th>Date</th><th>Day</th><th>Classes</th><th>Status</th></tr></thead>
                <tbody id="log-body"></tbody></table>
            </div>
        </div>

        <div id="tab-skip" class="tab-content">
            <div id="skip-container"></div>
        </div>
    </div>

    <nav>
        <div class="nav-item active" onclick="switchTab('overview',this)"><span class="nav-icon">📊</span><span>Overview</span></div>
        <div class="nav-item" onclick="switchTab('mark',this)"><span class="nav-icon">📅</span><span>Mark</span></div>
        <div class="nav-item" onclick="switchTab('subjects',this)"><span class="nav-icon">📚</span><span>Subject Wise</span></div>
        <div class="nav-item" onclick="switchTab('skip',this)"><span class="nav-icon">⚖️</span><span>Skip Calc</span></div>
    </nav>
</div>

<script>
const HOLIDAYS = ['2026-03-27','2026-03-31','2026-04-14','2026-05-01','2026-06-26'];
const SECTIONS = {
    A4: {
        label: 'Section A-4 | B.Tech Sem II',
        key: 'att_A4',
        subjects: {
            'PHY':      {name:'Engg Physics',    type:'Theory', total:75,  req75:true},
            'M-II':     {name:'Mathematics-II',  type:'Theory', total:75,  req75:true},
            'BME':      {name:'Basic Mech Engg', type:'Theory', total:73,  req75:true},
            'BCEM':     {name:'Basic Civil Engg', type:'Theory', total:75,  req75:true},
            'BCE':      {name:'Basic Comp Engg', type:'Theory', total:61,  req75:true},
            'PHY Lab':  {name:'Physics Lab',     type:'Lab',    total:32,  req75:true},
            'BCEM Lab': {name:'Civil Lab',        type:'Lab',    total:28,  req75:true},
            'LLS Lab':  {name:'LLS Lab',          type:'Lab',    total:32,  req75:true},
            'BME Lab':  {name:'Mech Lab',         type:'Lab',    total:32,  req75:true},
            'BCE Lab':  {name:'Computer Lab',     type:'Lab',    total:26,  req75:true},
            'M/L':      {name:'Mentor/Library',   type:'M/L',    total:16,  req75:false}
        },
        tt: {
            1:[{s:'BCEM',p:1},{s:'M-II',p:1},{s:'PHY Lab',p:2},{s:'PHY',p:1},{s:'BCE',p:1},{s:'M/L',p:1}],
            2:[{s:'BME',p:1},{s:'BME',p:1},{s:'BCEM Lab',p:2},{s:'M-II',p:1},{s:'BCEM',p:1},{s:'PHY',p:1}],
            3:[{s:'LLS Lab',p:2},{s:'PHY',p:1},{s:'BCE',p:1},{s:'BME',p:1},{s:'M-II',p:1},{s:'BCEM',p:1}],
            4:[{s:'BCEM',p:1},{s:'M-II',p:1},{s:'BME',p:1},{s:'BCE',p:1},{s:'PHY',p:1},{s:'BME Lab',p:2}],
            5:[{s:'BCE',p:1},{s:'M-II',p:1},{s:'BCEM',p:1},{s:'BME',p:1},{s:'PHY',p:1},{s:'BCE Lab',p:2}]
        }
    },
    B11: {
        label: 'Section B-11 | B.Tech Sem II',
        key: 'att_B11',
        subjects: {
            'BT101':    {name:'Engg Chemistry',     type:'Theory', total:75,  req75:true},
            'BT202':    {name:'Mathematics-II',      type:'Theory', total:75,  req75:true},
            'BT103':    {name:'Engg Communication',  type:'Theory', total:59,  req75:true},
            'BT104':    {name:'BEEE',                type:'Theory', total:75,  req75:true},
            'BT105':    {name:'Engg Graphics',       type:'Theory', total:59,  req75:true},
            'BT105Lab': {name:'Engg Graphics Lab',   type:'Lab',    total:48,  req75:true},
            'BT103Lab': {name:'Engg Comm Lab',       type:'Lab',    total:28,  req75:true},
            'BT104Lab': {name:'BEEE Lab',            type:'Lab',    total:32,  req75:true},
            'BT101Lab': {name:'Engg Chemistry Lab',  type:'Lab',    total:32,  req75:true},
            'BT106':    {name:'Mfg Practices Lab',   type:'Lab',    total:26,  req75:true},
            'ML':       {name:'Mentor/Library',      type:'M/L',    total:16,  req75:false}
        },
        tt: {
            1:[{s:'BT103',p:1},{s:'BT105Lab',p:3},{s:'BT202',p:1},{s:'BT104',p:1},{s:'BT101',p:1}],
            2:[{s:'BT103',p:1},{s:'BT202',p:1},{s:'BT104',p:1},{s:'BT105',p:1},{s:'BT101',p:1},{s:'BT103Lab',p:2}],
            3:[{s:'BT104Lab',p:2},{s:'BT202',p:1},{s:'BT105',p:1},{s:'BT103',p:1},{s:'BT101',p:1},{s:'BT104',p:1}],
            4:[{s:'BT101Lab',p:2},{s:'BT104',p:1},{s:'ML',p:1},{s:'BT101',p:1},{s:'BT202',p:1},{s:'BT105',p:1}],
            5:[{s:'BT106',p:2},{s:'BT202',p:1},{s:'BT105',p:1},{s:'BT104',p:1},{s:'BT101',p:1},{s:'BT103',p:1}]
        }
    }
};

let curSec = null;
let attData = {};

function selectSection(sec) {
    curSec = sec;
    localStorage.setItem('cur_sec', sec);
    attData = JSON.parse(localStorage.getItem(SECTIONS[sec].key) || '{}');
    document.getElementById('section-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('sec-label').innerText = SECTIONS[sec].label;
    document.getElementById('date-picker').value = new Date().toISOString().split('T')[0];
    // populate subject dropdown
    const filter = document.getElementById('sub-filter');
    filter.innerHTML = '';
    Object.keys(SECTIONS[sec].subjects).forEach(k => {
        const o = document.createElement('option');
        o.value = k; o.innerText = SECTIONS[sec].subjects[k].name;
        filter.appendChild(o);
    });
    // reset to overview
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('tab-overview').classList.add('active');
    document.querySelectorAll('.nav-item')[0].classList.add('active');
    renderOverview();
}

function changeSection() {
    document.getElementById('section-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
}

function isHoliday(ds) {
    const d = new Date(ds+'T00:00:00'), day = d.getDay();
    return day===0 || day===6 || HOLIDAYS.includes(ds);
}
function inSem(ds) { return ds >= '2026-03-16' && ds <= '2026-07-03'; }

function switchTab(id, el) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('tab-'+id).classList.add('active');
    el.classList.add('active');
    if(id==='overview') renderOverview();
    if(id==='skip') renderSkipCalc();
    if(id==='subjects') renderSubjectLogs();
}

function loadDay() {
    const date = document.getElementById('date-picker').value;
    const ui = document.getElementById('day-ui');
    const msg = document.getElementById('holiday-msg');
    const list = document.getElementById('period-list');
    list.innerHTML = '';
    if(!inSem(date)) { ui.style.display='none'; msg.style.display='block'; msg.innerText='Semester ke bahar ki date hai.'; return; }
    if(isHoliday(date)) { ui.style.display='none'; msg.style.display='block'; msg.innerText='Weekend ya Holiday hai. Enjoy!'; return; }
    ui.style.display='block'; msg.style.display='none';
    const dow = new Date(date+'T00:00:00').getDay();
    const periods = SECTIONS[curSec].tt[dow];
    periods.forEach((p, idx) => {
        const existing = attData[date] || {};
        const state = existing[idx];
        const isP = state===true, isA = state===false;
        const name = SECTIONS[curSec].subjects[p.s]?.name || p.s;
        const div = document.createElement('div');
        div.className = 'period-item';
        div.innerHTML = `<div class="period-info">
            <div class="period-name">${name}</div>
            <div class="period-pts">${p.p>1?'Lab ('+p.p+' classes)':'1 class'}</div>
        </div>
        <div class="tog-grp" data-idx="${idx}">
            <button class="tog-btn p ${isP?'active':''}" onclick="setTog(this,'p')">P</button>
            <button class="tog-btn a ${isA?'active':''}" onclick="setTog(this,'a')">A</button>
            <button class="tog-btn r ${(!isP&&!isA)?'active':''}" onclick="setTog(this,'r')">—</button>
        </div>`;
        list.appendChild(div);
    });
}

function setTog(el, val) {
    el.parentElement.querySelectorAll('.tog-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
}
function markAll(val) {
    document.querySelectorAll('.tog-grp').forEach(g => {
        g.querySelectorAll('.tog-btn').forEach(b => b.classList.remove('active'));
        g.querySelector('.'+val).classList.add('active');
    });
}
function saveAtt() {
    const date = document.getElementById('date-picker').value;
    const dayData = {}; let any = false;
    document.querySelectorAll('.tog-grp').forEach(g => {
        const idx = g.dataset.idx;
        if(g.querySelector('.p').classList.contains('active')) { dayData[idx]=true; any=true; }
        else if(g.querySelector('.a').classList.contains('active')) { dayData[idx]=false; any=true; }
    });
    if(any) attData[date]=dayData; else delete attData[date];
    localStorage.setItem(SECTIONS[curSec].key, JSON.stringify(attData));
    alert('Saved!');
    renderOverview();
}

function calcStats() {
    const subs = SECTIONS[curSec].subjects, tt = SECTIONS[curSec].tt;
    const stats = {};
    Object.keys(subs).forEach(k => stats[k]={attended:0,held:0});
    Object.keys(attData).forEach(date => {
        const dow = new Date(date+'T00:00:00').getDay();
        const sched = tt[dow]; if(!sched) return;
        Object.keys(attData[date]).forEach(pi => {
            const p = sched[pi]; if(!p) return;
            stats[p.s].held += p.p;
            if(attData[date][pi]) stats[p.s].attended += p.p;
        });
    });
    return stats;
}

function renderOverview() {
    const subs = SECTIONS[curSec].subjects, stats = calcStats();
    const cont = document.getElementById('subject-cards-container');
    cont.innerHTML = '';
    let gA=0, gH=0;
    Object.keys(subs).forEach(k => {
        const sub=subs[k], s=stats[k];
        const perc = s.held>0 ? Math.round(s.attended/s.held*100) : 0;
        gA+=s.attended; gH+=s.held;
        const color = (perc<75 && sub.req75) ? 'var(--danger)' : 'var(--success)';
        const tagCls = sub.type==='Theory'?'tag-theory':sub.type==='Lab'?'tag-lab':'tag-ml';
        const unit = sub.type==='Lab'?'labs':'classes';
        const card = document.createElement('div'); card.className='card';
        card.innerHTML = `<div class="subj-hdr">
            <div><span class="subj-name">${sub.name}</span>
            <div style="font-size:0.7rem;color:var(--text-dim)">Held: ${s.held} | Attended: ${s.attended} | Total: ${sub.total}</div></div>
            <span class="tag ${tagCls}">${sub.type==='Theory'?'Theory':sub.type==='Lab'?'Lab':'M/L'}</span>
        </div>
        <div class="prog-wrap"><div class="prog-bar" style="width:${perc}%;background:${color};box-shadow:0 0 8px ${color}60"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:0.8rem;">
            <span style="color:${color};font-weight:700">${perc}%</span>
            <span style="color:var(--text-dim)">${sub.req75?'Need '+Math.ceil(sub.total*0.75)+' '+unit:'No 75% req'}</span>
        </div>`;
        cont.appendChild(card);
    });
    document.getElementById('overall-perc').innerText = gH>0 ? Math.round(gA/gH*100)+'%' : '0%';
    document.getElementById('overall-held').innerText = gH;
    document.getElementById('overall-attended').innerText = gA;
}

function renderSkipCalc() {
    const subs = SECTIONS[curSec].subjects, stats = calcStats();
    const cont = document.getElementById('skip-container');
    cont.innerHTML = '<h2 style="font-size:1.1rem;margin-bottom:15px;">Safety Calculator (75% Goal)</h2>';
    Object.keys(subs).forEach(k => {
        const sub=subs[k]; if(!sub.req75) return;
        const s=stats[k];
        const rem = sub.total-s.held;
        const req = Math.ceil(0.75*sub.total);
        const canMiss = Math.max(0,(s.attended+rem)-req);
        const needMore = Math.max(0,req-s.attended);
        const unit = sub.type==='Lab'?'labs':'classes';
        let alert = '';
        if(s.attended+rem < req) alert=`<div class="alert-box alert-danger">Critical: Max possible is ${Math.round(((s.attended+rem)/sub.total)*100)}%</div>`;
        else if(canMiss>0) alert=`<div class="alert-box alert-safe">Can safely skip <b>${canMiss}</b> more ${unit}</div>`;
        else alert=`<div class="alert-box alert-danger">Need <b>${needMore}</b> more ${unit} for 75%</div>`;
        const card = document.createElement('div'); card.className='card';
        card.innerHTML = `<div class="subj-name" style="margin-bottom:12px;">${sub.name}</div>
            <div class="calc-row"><span>Attended so far:</span><span class="calc-val">${s.attended} / ${s.held} ${unit}</span></div>
            <div class="calc-row"><span>Remaining in semester:</span><span class="calc-val">${rem} ${unit}</span></div>
            <div class="calc-row"><span>Required for 75%:</span><span class="calc-val">${req} / ${sub.total} ${unit}</span></div>
            ${alert}`;
        cont.appendChild(card);
    });
}

function renderSubjectLogs() {
    const subs = SECTIONS[curSec].subjects, tt = SECTIONS[curSec].tt;
    const subKey = document.getElementById('sub-filter').value;
    const body = document.getElementById('log-body');
    body.innerHTML = '';
    Object.keys(attData).sort().reverse().forEach(date => {
        const dow = new Date(date+'T00:00:00').getDay();
        const sched = tt[dow]; if(!sched) return;
        sched.forEach((p, idx) => {
            if(p.s===subKey && attData[date][idx]!==undefined) {
                const status = attData[date][idx];
                const row = document.createElement('tr');
                row.innerHTML = `<td>${date.split('-').slice(1).join('/')}</td>
                    <td style="color:var(--text-dim)">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dow]}</td>
                    <td>${p.p}</td>
                    <td style="color:${status?'var(--accent-toggle)':'var(--danger)'};font-weight:700">${status?'P':'A'}</td>`;
                body.appendChild(row);
            }
        });
    });
}

window.onload = function() {
    const saved = localStorage.getItem('cur_sec');
    if(saved && SECTIONS[saved]) selectSection(saved);
};
</script>
