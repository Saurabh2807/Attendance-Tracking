<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Attendance Tracking">
    <title>Attendance Tracking</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-overall: #0c142b;
            --card-surface: #19233f;
            --primary: #468df9;
            --accent-toggle: #5be9a6;
            --danger: #ff5c5c;
            --success: #6fe4a7;
            --warning: #facc15;
            --text-main: #ffffff;
            --text-dim: #9ca3af;
            --border: #2c3859;
            --bg-day: linear-gradient(180deg, #d8f2fd 0%, #fbd89a 40%, #fd9a76 70%, #19233f 100%);
            --bg-night: linear-gradient(180deg, #101c40 0%, #0d1223 60%, #0c142b 100%);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-overall);
            color: var(--text-main);
            padding-bottom: 80px;
            overflow-x: hidden;
            background-image: var(--bg-night);
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
        }
        header {
            padding: 25px 20px;
            backdrop-filter: blur(5px);
            border-bottom: 1px solid var(--border);
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        h1 { margin: 0; font-size: 1.5rem; letter-spacing: -0.5px; }
        .sub-header { color: var(--text-dim); font-size: 0.85rem; margin-top: 5px; }
        nav {
            position: fixed; bottom: 0; width: 100%;
            background: rgba(12, 20, 43, 0.95);
            backdrop-filter: blur(15px);
            display: flex; justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid var(--border);
            z-index: 1000;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: var(--text-dim); font-size: 0.7rem; text-decoration: none;
            cursor: pointer; transition: color 0.2s;
        }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 1.4rem; margin-bottom: 4px; }
        .container { padding: 20px; max-width: 600px; margin: 0 auto; position: relative; }
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .card {
            background: rgba(25, 35, 63, 0.85);
            border-radius: 20px; padding: 20px; margin-bottom: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
        }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .stat-card { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; text-align: center; }
        .stat-val { display: block; font-size: 1.4rem; font-weight: 700; color: var(--primary); }
        .stat-label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; }
        .subject-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .subject-name { font-weight: 600; font-size: 1rem; }
        .tag { font-size: 0.65rem; padding: 4px 9px; border-radius: 6px; text-transform: uppercase; font-weight: 700; }
        .tag-theory { background: rgba(70, 141, 249, 0.2); color: #80b3fc; }
        .tag-lab { background: rgba(147, 51, 234, 0.2); color: #d1c4e9; }
        .tag-ml { background: rgba(156, 163, 175, 0.2); color: #9ca3af; }
        .progress-container { height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; margin: 10px 0; overflow: hidden; }
        .progress-bar { height: 100%; transition: width 0.5s ease; border-radius: 5px; }
        input[type="date"] {
            width: 100%; background: var(--bg-overall);
            border: 1px solid var(--border); color: white;
            padding: 12px; border-radius: 12px;
            font-family: inherit; margin-bottom: 15px; font-size: 0.9rem;
            color-scheme: dark;
        }
        button {
            width: 100%; padding: 14px; border-radius: 12px;
            border: none; font-weight: 600; font-family: inherit;
            cursor: pointer; transition: all 0.2s;
        }
        button:active { transform: scale(0.98); }
        .btn-primary { background: var(--primary); color: white; margin-bottom: 10px; }
        .btn-save { background: var(--primary); color: white; margin-top: 20px; font-weight: 700; }
        .period-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 0; border-bottom: 1px solid var(--border);
        }
        .period-info { flex: 1; }
        .period-name { font-weight: 500; font-size: 0.95rem; }
        .period-points { font-size: 0.75rem; color: var(--text-dim); }
        .toggle-group { display: flex; background: rgba(255,255,255,0.05); border-radius: 10px; padding: 4px; }
        .toggle-btn {
            padding: 7px 18px; border-radius: 8px; font-size: 0.8rem;
            font-weight: 700; cursor: pointer; transition: 0.2s;
            color: var(--text-dim); background: none; border: none; font-family: inherit;
        }
        .toggle-btn.active.p { background: var(--accent-toggle); color: #0c142b; }
        .toggle-btn.active.a { background: var(--danger); color: white; }
        .toggle-btn.active.r { background: rgba(255,255,255,0.15); color: white; }
        .calc-row { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 5px; }
        .calc-val { font-weight: 600; }
        .alert-box {
            padding: 10px; border-radius: 8px; font-size: 0.85rem;
            margin-top: 10px; text-align: center; font-weight: 500;
        }
        .alert-safe { background: rgba(91, 233, 166, 0.1); color: var(--success); border: 1px solid rgba(91, 233, 166, 0.2); }
        .alert-danger { background: rgba(255, 92, 92, 0.1); color: var(--danger); border: 1px solid rgba(255, 92, 92, 0.2); }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { text-align: left; color: var(--text-dim); padding: 10px; border-bottom: 1px solid var(--border); }
        td { padding: 10px; border-bottom: 1px solid var(--border); }
        select {
            width: 100%; background: var(--card-surface); color: white;
            border: 1px solid var(--border); padding: 12px;
            border-radius: 12px; margin-bottom: 15px; font-family: inherit; font-size: 0.9rem;
        }
    </style>
</head>
<body>

<header>
    <h1>Attendance Tracking</h1>
    <div class="sub-header">Set A | B.Tech Sem II</div>
</header>

<div class="container">
    <div id="tab-overview" class="tab-content active">
        <div class="stat-grid">
            <div class="stat-card">
                <span class="stat-label">Total Classes</span>
                <span class="stat-val">525</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Overall %</span>
                <span id="overall-perc" class="stat-val">0%</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Classes Held</span>
                <span id="overall-held" class="stat-val">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Attended</span>
                <span id="overall-attended" class="stat-val">0</span>
            </div>
        </div>
        <div id="subject-cards-container"></div>
    </div>

    <div id="tab-mark" class="tab-content">
        <div class="card">
            <label style="display:block; margin-bottom:8px; font-size:0.8rem; color:var(--text-dim)">Select Date</label>
            <input type="date" id="date-picker">
            <button class="btn-primary" onclick="loadDay()">Load Schedule</button>
            <div id="day-selector-ui" style="display:none; margin-top:20px;">
                <div style="display:flex; gap:10px; margin-bottom:20px;">
                    <button style="background:rgba(91,233,166,0.15); color:var(--accent-toggle); font-size:0.8rem;" onclick="markAll('p')">All Present</button>
                    <button style="background:rgba(255,92,92,0.15); color:var(--danger); font-size:0.8rem;" onclick="markAll('a')">All Absent</button>
                    <button style="background:rgba(255,255,255,0.07); color:var(--text-dim); font-size:0.8rem;" onclick="markAll('r')">Reset All</button>
                </div>
                <div id="period-list"></div>
                <button class="btn-save" onclick="saveAttendance()">Save Attendance</button>
            </div>
            <div id="holiday-msg" style="display:none; text-align:center; padding:40px 20px; color:var(--text-dim);">
                Weekend or Holiday. Enjoy your day off!
            </div>
        </div>
    </div>

    <div id="tab-subjects" class="tab-content">
        <select id="sub-filter" onchange="renderSubjectLogs()"></select>
        <div class="card" style="padding:10px; overflow-x:auto;">
            <table id="log-table">
                <thead><tr><th>Date</th><th>Day</th><th>Pts</th><th>Status</th></tr></thead>
                <tbody id="log-body"></tbody>
            </table>
        </div>
    </div>

    <div id="tab-skip" class="tab-content">
        <div id="skip-container"></div>
    </div>
</div>

<nav>
    <div class="nav-item active" onclick="switchTab('overview', this)">
        <span class="nav-icon">📊</span><span>Overview</span>
    </div>
    <div class="nav-item" onclick="switchTab('mark', this)">
        <span class="nav-icon">📅</span><span>Mark</span>
    </div>
    <div class="nav-item" onclick="switchTab('subjects', this)">
        <span class="nav-icon">📚</span><span>Subject Wise</span>
    </div>
    <div class="nav-item" onclick="switchTab('skip', this)">
        <span class="nav-icon">⚖️</span><span>Skip Calc</span>
    </div>
</nav>

<script>
const CONFIG = {
    holidays: ['2026-03-27','2026-03-31','2026-04-14','2026-05-01','2026-06-26'],
    subjects: {
        'PHY':      { name:'Engg Physics',    type:'Theory', total:75,  req75:true  },
        'M-II':     { name:'Mathematics-II',  type:'Theory', total:75,  req75:true  },
        'BME':      { name:'Basic Mech Engg', type:'Theory', total:73,  req75:true  },
        'BCEM':     { name:'Basic Civil Engg', type:'Theory', total:75,  req75:true  },
        'BCE':      { name:'Basic Comp Engg', type:'Theory', total:61,  req75:true  },
        'PHY Lab':  { name:'Physics Lab',     type:'Lab',    total:32,  req75:true  },
        'BCEM Lab': { name:'Civil Lab',        type:'Lab',    total:28,  req75:true  },
        'LLS Lab':  { name:'LLS Lab',          type:'Lab',    total:32,  req75:true  },
        'BME Lab':  { name:'Mech Lab',         type:'Lab',    total:32,  req75:true  },
        'BCE Lab':  { name:'Computer Lab',     type:'Lab',    total:26,  req75:true  },
        'M/L':      { name:'Mentor/Library',   type:'M/L',    total:16,  req75:false }
    },
    timetable: {
        1: [{s:'BCEM',p:1},{s:'M-II',p:1},{s:'PHY Lab',p:2},{s:'PHY',p:1},{s:'BCE',p:1},{s:'M/L',p:1}],
        2: [{s:'BME',p:1},{s:'BME',p:1},{s:'BCEM Lab',p:2},{s:'M-II',p:1},{s:'BCEM',p:1},{s:'PHY',p:1}],
        3: [{s:'LLS Lab',p:2},{s:'PHY',p:1},{s:'BCE',p:1},{s:'BME',p:1},{s:'M-II',p:1},{s:'BCEM',p:1}],
        4: [{s:'BCEM',p:1},{s:'M-II',p:1},{s:'BME',p:1},{s:'BCE',p:1},{s:'PHY',p:1},{s:'BME Lab',p:2}],
        5: [{s:'BCE',p:1},{s:'M-II',p:1},{s:'BCEM',p:1},{s:'BME',p:1},{s:'PHY',p:1},{s:'BCE Lab',p:2}]
    }
};

let attendanceData = JSON.parse(localStorage.getItem('lncte_v2')) || {};

function init() {
    document.getElementById('date-picker').value = new Date().toISOString().split('T')[0];
    const filter = document.getElementById('sub-filter');
    Object.keys(CONFIG.subjects).forEach(key => {
        let opt = document.createElement('option');
        opt.value = key;
        opt.innerText = CONFIG.subjects[key].name;
        filter.appendChild(opt);
    });
    renderOverview();
}

function switchTab(tabId, el) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('tab-' + tabId).classList.add('active');
    el.classList.add('active');
    if(tabId === 'overview') renderOverview();
    if(tabId === 'skip') renderSkipCalc();
    if(tabId === 'subjects') renderSubjectLogs();
}

function isHoliday(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const day = d.getDay();
    return day === 0 || day === 6 || CONFIG.holidays.includes(dateStr);
}

function isInSemester(dateStr) {
    return dateStr >= '2026-03-16' && dateStr <= '2026-07-03';
}

function loadDay() {
    const date = document.getElementById('date-picker').value;
    const ui = document.getElementById('day-selector-ui');
    const holidayMsg = document.getElementById('holiday-msg');
    const list = document.getElementById('period-list');
    list.innerHTML = '';

    if (!isInSemester(date)) {
        ui.style.display = 'none';
        holidayMsg.style.display = 'block';
        holidayMsg.innerText = 'This date is outside the semester.';
        return;
    }
    if (isHoliday(date)) {
        ui.style.display = 'none';
        holidayMsg.style.display = 'block';
        holidayMsg.innerText = 'Weekend or Holiday. Enjoy your day off!';
        return;
    }
    ui.style.display = 'block';
    holidayMsg.style.display = 'none';

    const dayOfWeek = new Date(date + 'T00:00:00').getDay();
    const periods = CONFIG.timetable[dayOfWeek];

    periods.forEach((p, idx) => {
        const existing = attendanceData[date] || {};
        // state: true = present, false = absent, undefined = not marked
        const state = existing[idx];
        const isPresent = state === true;
        const isAbsent = state === false;
        const div = document.createElement('div');
        div.className = 'period-item';
        div.innerHTML = `
            <div class="period-info">
                <div class="period-name">${p.s}</div>
                <div class="period-points">${p.p > 1 ? 'Lab (' + p.p + ' classes)' : '1 class'}</div>
            </div>
            <div class="toggle-group" data-idx="${idx}">
                <button class="toggle-btn p ${isPresent?'active':''}" onclick="setToggle(this,'p')">P</button>
                <button class="toggle-btn a ${isAbsent?'active':''}" onclick="setToggle(this,'a')">A</button>
                <button class="toggle-btn r ${(!isPresent&&!isAbsent)?'active':''}" onclick="setToggle(this,'r')">—</button>
            </div>`;
        list.appendChild(div);
    });
}

function setToggle(el, val) {
    const parent = el.parentElement;
    parent.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
}

function markAll(val) {
    document.querySelectorAll('.toggle-group').forEach(group => {
        group.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
        if(val === 'p') group.querySelector('.p').classList.add('active');
        else if(val === 'a') group.querySelector('.a').classList.add('active');
        else group.querySelector('.r').classList.add('active');
    });
}

function saveAttendance() {
    const date = document.getElementById('date-picker').value;
    const dayData = {};
    let hasAnyMarked = false;
    document.querySelectorAll('.toggle-group').forEach(group => {
        const idx = group.dataset.idx;
        if(group.querySelector('.p').classList.contains('active')) {
            dayData[idx] = true;
            hasAnyMarked = true;
        } else if(group.querySelector('.a').classList.contains('active')) {
            dayData[idx] = false;
            hasAnyMarked = true;
        }
        // if — is active, don't save that index (treat as unmarked)
    });
    if(hasAnyMarked) {
        attendanceData[date] = dayData;
    } else {
        // all reset — remove the day entirely
        delete attendanceData[date];
    }
    localStorage.setItem('lncte_v2', JSON.stringify(attendanceData));
    alert('Saved!');
    renderOverview();
}

function calculateStats() {
    let stats = {};
    Object.keys(CONFIG.subjects).forEach(s => stats[s] = { attended: 0, held: 0 });
    Object.keys(attendanceData).forEach(date => {
        const dObj = new Date(date + 'T00:00:00');
        const dayNum = dObj.getDay();
        const daySched = CONFIG.timetable[dayNum];
        if (!daySched) return;
        Object.keys(attendanceData[date]).forEach(pIdx => {
            const pInfo = daySched[pIdx];
            if (!pInfo) return;
            stats[pInfo.s].held += pInfo.p;
            if (attendanceData[date][pIdx]) stats[pInfo.s].attended += pInfo.p;
        });
    });
    return stats;
}

function renderOverview() {
    const stats = calculateStats();
    const container = document.getElementById('subject-cards-container');
    container.innerHTML = '';
    let gAttended = 0, gHeld = 0;
    Object.keys(CONFIG.subjects).forEach(key => {
        const sub = CONFIG.subjects[key];
        const s = stats[key];
        const perc = s.held > 0 ? Math.round((s.attended / s.held) * 100) : 0;
        gAttended += s.attended;
        gHeld += s.held;
        const color = (perc < 75 && sub.req75) ? 'var(--danger)' : 'var(--success)';
        const tagClass = sub.type === 'Theory' ? 'tag-theory' : sub.type === 'Lab' ? 'tag-lab' : 'tag-ml';
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="subject-header">
                <div>
                    <span class="subject-name">${sub.name}</span>
                    <div style="font-size:0.7rem; color:var(--text-dim)">Held: ${s.held} | Attended: ${s.attended} | Total: ${sub.total}</div>
                </div>
                <span class="tag ${tagClass}">${sub.type === 'Theory' ? 'Theory' : sub.type === 'Lab' ? 'Lab' : 'M/L'}</span>
            </div>
            <div class="progress-container">
                <div class="progress-bar" style="width:${perc}%; background:${color}; box-shadow:0 0 8px ${color}60"></div>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:0.8rem;">
                <span style="color:${color}; font-weight:700">${perc}%</span>
                <span style="color:var(--text-dim)">${sub.req75 ? 'Need ' + Math.ceil(sub.total*0.75) + (sub.type === 'Lab' ? ' labs' : ' classes') : 'No 75% req'}</span>
            </div>`;
        container.appendChild(card);
    });
    document.getElementById('overall-perc').innerText = gHeld > 0 ? Math.round((gAttended/gHeld)*100)+'%' : '0%';
    document.getElementById('overall-held').innerText = gHeld;
    document.getElementById('overall-attended').innerText = gAttended;
}

function renderSkipCalc() {
    const stats = calculateStats();
    const container = document.getElementById('skip-container');
    container.innerHTML = '<h2 style="font-size:1.1rem; margin-bottom:15px;">Safety Calculator (75% Goal)</h2>';
    Object.keys(CONFIG.subjects).forEach(key => {
        const sub = CONFIG.subjects[key];
        if (!sub.req75) return;
        const s = stats[key];
        const remaining = sub.total - s.held;
        const reqPoints = Math.ceil(0.75 * sub.total);
        const canMiss = Math.max(0, (s.attended + remaining) - reqPoints);
        const needMore = Math.max(0, reqPoints - s.attended);
        const card = document.createElement('div');
        card.className = 'card';
        const unit = sub.type === 'Lab' ? 'labs' : 'classes';
        let alertHtml = '';
        if (s.attended + remaining < reqPoints) {
            alertHtml = `<div class="alert-box alert-danger">Critical: Max possible is ${Math.round(((s.attended+remaining)/sub.total)*100)}%</div>`;
        } else if (canMiss > 0) {
            alertHtml = `<div class="alert-box alert-safe">Can safely skip <b>${canMiss}</b> more ${unit}</div>`;
        } else {
            alertHtml = `<div class="alert-box alert-danger">Need <b>${needMore}</b> more ${unit} for 75%</div>`;
        }
        card.innerHTML = `
            <div class="subject-name" style="margin-bottom:12px;">${sub.name}</div>
            <div class="calc-row"><span>Attended so far:</span><span class="calc-val">${s.attended} / ${s.held} ${unit}</span></div>
            <div class="calc-row"><span>Remaining in semester:</span><span class="calc-val">${remaining} ${unit}</span></div>
            <div class="calc-row"><span>Required for 75%:</span><span class="calc-val">${reqPoints} / ${sub.total} ${unit}</span></div>
            ${alertHtml}`;
        container.appendChild(card);
    });
}

function renderSubjectLogs() {
    const subKey = document.getElementById('sub-filter').value;
    const body = document.getElementById('log-body');
    body.innerHTML = '';
    const dates = Object.keys(attendanceData).sort().reverse();
    dates.forEach(date => {
        const dayNum = new Date(date + 'T00:00:00').getDay();
        const sched = CONFIG.timetable[dayNum];
        if (!sched) return;
        sched.forEach((p, idx) => {
            if (p.s === subKey) {
                const status = attendanceData[date][idx];
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${date.split('-').slice(1).join('/')}</td>
                    <td style="color:var(--text-dim)">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dayNum]}</td>
                    <td>${p.p}</td>
                    <td style="color:${status?'var(--accent-toggle)':'var(--danger)'}; font-weight:700">${status?'P':'A'}</td>`;
                body.appendChild(row);
            }
        });
    });
}

init();
</script>
</body>
</html>
