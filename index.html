
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Attendance Tracking">
    <title>Attendance Tracking</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0c142b;
            --bg2: #19233f;
            --primary: #468df9;
            --green: #5be9a6;
            --danger: #ff5c5c;
            --success: #6fe4a7;
            --text: #ffffff;
            --dim: #9ca3af;
            --border: #2c3859;
            --card-bg: rgba(25,35,63,0.7);
            --card-blur: blur(14px);
            --card-border: rgba(255,255,255,0.07);
        }
        .light {
            --bg: #f0f4ff;
            --bg2: #ffffff;
            --text: #1a1f36;
            --dim: #64748b;
            --border: #cbd5e1;
            --card-bg: rgba(255,255,255,0.75);
            --card-border: rgba(0,0,0,0.06);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg); color: var(--text);
            padding-bottom: 80px; overflow-x: hidden;
            background-image: linear-gradient(180deg, #101c40 0%, #0d1223 60%, #0c142b 100%);
            background-size: cover; background-attachment: fixed; min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }
        body.light { background-image: linear-gradient(180deg, #dbeafe 0%, #eff6ff 60%, #f0f4ff 100%); }

        header {
            padding: 20px 20px 14px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100; background: rgba(12,20,43,0.85); transition: background 0.3s;
        }
        body.light header { background: rgba(240,244,255,0.85); }
        .header-left h1 { margin: 0; font-size: 1.4rem; letter-spacing: -0.5px; }
        .header-left .sub-header { color: var(--dim); font-size: 0.8rem; margin-top: 3px; display: flex; align-items: center; gap: 8px; }
        .change-btn { font-size: 0.7rem; padding: 3px 12px; border-radius: 20px; background: rgba(70,141,249,0.15); color: var(--primary); border: 1px solid rgba(70,141,249,0.3); cursor: pointer; font-family: inherit; font-weight: 600; }
        .theme-btn { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: var(--text); font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        nav {
            position: fixed; bottom: 0; width: 100%; background: rgba(12,20,43,0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: flex; justify-content: space-around; padding: 10px 0 12px; border-top: 1px solid var(--border); z-index: 1000;
        }
        body.light nav { background: rgba(240,244,255,0.95); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--dim); font-size: 0.68rem; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 1.3rem; margin-bottom: 3px; }

        .container { padding: 16px; max-width: 600px; margin: 0 auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeUp 0.3s ease; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        #section-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; }
        .sec-btn { width: 100%; max-width: 340px; padding: 20px; border-radius: 20px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); margin-bottom: 14px; text-align: left; cursor: pointer; }
        .card { background: var(--card-bg); backdrop-filter: var(--card-blur); border-radius: 20px; padding: 18px; margin-bottom: 14px; border: 1px solid var(--card-border); box-shadow: 0 8px 32px rgba(0,0,0,0.18); }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
        .stat-card { background: rgba(255,255,255,0.04); padding: 14px; border-radius: 14px; text-align: center; border: 1px solid var(--card-border); }
        .stat-val { display: block; font-size: 1.5rem; font-weight: 700; color: var(--primary); }
        .stat-label { font-size: 0.7rem; color: var(--dim); text-transform: uppercase; }

        .subj-hdr { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .subj-name { font-weight: 600; font-size: 0.95rem; }
        .tag { font-size: 0.62rem; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; font-weight: 700; }
        .tag-theory { background: rgba(70,141,249,0.18); color: #80b3fc; }
        .tag-lab { background: rgba(147,51,234,0.18); color: #d1c4e9; }
        .prog-wrap { height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; margin: 10px 0; overflow: hidden; }
        .prog-bar { height: 100%; transition: width 0.6s ease; }

        input[type="date"] { width: 100%; background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 12px; margin-bottom: 12px; font-family: inherit; }
        button { width: 100%; padding: 13px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; font-family: inherit; }
        .btn-p { background: var(--primary); color: white; }
        .btn-save { background: var(--primary); color: white; margin-top: 16px; font-weight: 700; }

        .period-item { display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--border); }
        .tog-grp { display: flex; background: rgba(255,255,255,0.05); border-radius: 10px; padding: 3px; gap: 2px; }
        .tog-btn { padding: 7px 11px; border-radius: 8px; font-size: 0.78rem; font-weight: 700; cursor: pointer; background: none; color: var(--dim); border: none; font-family: inherit; }
        .tog-btn.active.p { background: var(--green); color: #0c142b; }
        .tog-btn.active.a { background: var(--danger); color: white; }
        .tog-btn.active.r { background: rgba(255,255,255,0.15); color: var(--text); }

        table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
        th { text-align: left; color: var(--dim); padding: 10px; border-bottom: 1px solid var(--border); text-transform: uppercase; }
        td { padding: 10px; border-bottom: 1px solid var(--border); }
        select { width: 100%; background: var(--bg2); color: var(--text); border: 1px solid var(--border); padding: 12px; border-radius: 12px; margin-bottom: 14px; font-family: inherit; }

        #app { display: none; }
    </style>
</head>
<body>

<div id="section-screen">
    <h2>Attendance Tracking</h2>
    <p>B.Tech II Semester • Session 2025-26</p>
    <button class="sec-btn" onclick="selectSection('A4')"><b>Section A-4</b><br><small>LNCTE • CSE</small></button>
    <button class="sec-btn" onclick="selectSection('B11')"><b>Section B-11</b><br><small>LNCT&S • AIML</small></button>
</div>

<div id="app">
    <header>
        <div class="header-left">
            <h1>Attendance</h1>
            <div class="sub-header"><span id="sec-label"></span> <button class="change-btn" onclick="changeSection()">Change</button></div>
        </div>
        <button class="theme-btn" onclick="toggleTheme()" id="theme-btn">🌙</button>
    </header>

    <div class="container">
        <div id="tab-overview" class="tab-content active"><div class="stat-grid" id="stat-grid"></div><div id="subject-cards-container"></div></div>
        <div id="tab-mark" class="tab-content">
            <div class="card">
                <input type="date" id="date-picker">
                <button class="btn-p" onclick="loadDay()">Load Schedule</button>
                <div id="day-ui" style="display:none;margin-top:18px;"><div id="period-list"></div><button class="btn-save" onclick="saveAtt()">Save Attendance</button></div>
                <div id="holiday-msg" style="display:none; text-align:center; padding:20px;">🎉 Holiday/Weekend!</div>
            </div>
        </div>
        <div id="tab-skip" class="tab-content"><div id="skip-container"></div></div>
        <div id="tab-logs" class="tab-content">
            <select id="sub-filter" onchange="renderLogs()"></select>
            <div class="card" style="padding:10px; overflow-x:auto;">
                <table><thead><tr><th>Date</th><th>Day</th><th>Pts</th><th>Status</th></tr></thead><tbody id="log-body"></tbody></table>
            </div>
        </div>
    </div>

    <nav>
        <div class="nav-item active" onclick="switchTab('overview',this)"><span class="nav-icon">📊</span><span>Overview</span></div>
        <div class="nav-item" onclick="switchTab('mark',this)"><span class="nav-icon">📅</span><span>Mark</span></div>
        <div class="nav-item" onclick="switchTab('skip',this)"><span class="nav-icon">⚖️</span><span>Skip</span></div>
        <div class="nav-item" onclick="switchTab('logs',this)"><span class="nav-icon">📚</span><span>Logs</span></div>
    </nav>
</div>

<script>
const HOLIDAYS = ['2026-03-27','2026-03-30']; 
const SECTIONS = {
    A4: {
        key: 'att_A4', label: 'Section A-4',
        subjects: {
            'BT201': {name:'Physics', type:'Theory', total:75, req75:true},
            'BT202': {name:'Maths-II', type:'Theory', total:75, req75:true},
            'BT203': {name:'BME', type:'Theory', total:73, req75:true},
            'BT204': {name:'Civil', type:'Theory', total:75, req75:true},
            'BT205': {name:'Computer', type:'Theory', total:61, req75:true},
            'BT201L': {name:'Physics Lab', type:'Lab', total:32, req75:true},
            'BT204L': {name:'Civil Lab', type:'Lab', total:28, req75:true},
            'BT206': {name:'LLS Lab', type:'Lab', total:32, req75:true},
            'BT203L': {name:'Mech Lab', type:'Lab', total:32, req75:true},
            'BT205L': {name:'Comp Lab', type:'Lab', total:26, req75:true},
            'ML': {name:'Mentor', type:'M/L', total:16, req75:false}
        },
        tt: {
            1:[{s:'BT204',p:1},{s:'BT202',p:1},{s:'BT201',p:1},{s:'BT201',p:1},{s:'BT205',p:1},{s:'ML',p:1}],
            2:[{s:'BT203',p:1},{s:'BT203',p:1},{s:'BT202',p:1},{s:'BT204L',p:2},{s:'BT201',p:1}],
            3:[{s:'BT206',p:2},{s:'BT201',p:1},{s:'BT205',p:1},{s:'BT203',p:1},{s:'BT202',p:1},{s:'BT204',p:1}],
            4:[{s:'BT204',p:1},{s:'BT202',p:1},{s:'BT203',p:1},{s:'BT205',p:1},{s:'BT201',p:1},{s:'BT203L',p:2}],
            5:[{s:'BT205',p:1},{s:'BT202',p:1},{s:'BT204',p:1},{s:'BT203',p:1},{s:'BT201',p:1},{s:'BT205L',p:2}]
        }
    },
    B11: {
        key: 'att_B11', label: 'Section B-11',
        subjects: {
            'BT101': {name:'Chemistry', type:'Theory', total:75, req75:true},
            'BT202': {name:'Maths-II', type:'Theory', total:75, req75:true},
            'BT103': {name:'Comm', type:'Theory', total:59, req75:true},
            'BT104': {name:'BEEE', type:'Theory', total:75, req75:true},
            'BT105': {name:'Graphics', type:'Theory', total:60, req75:true},
            'BT105L': {name:'Graphics Lab', type:'Lab', total:45, req75:true},
            'BT103L': {name:'Comm Lab', type:'Lab', total:30, req75:true},
            'BT104L': {name:'BEEE Lab', type:'Lab', total:32, req75:true},
            'BT101L': {name:'Chem Lab', type:'Lab', total:32, req75:true},
            'BT106': {name:'Mfg Lab', type:'Lab', total:26, req75:true},
            'ML': {name:'Mentor', type:'M/L', total:16, req75:false}
        },
        tt: {
            1:[{s:'BT101',p:1},{s:'BT202',p:1},{s:'BT103',p:1},{s:'BT104',p:1},{s:'BT105L',p:3}],
            2:[{s:'BT101',p:1},{s:'BT202',p:1},{s:'BT103',p:1},{s:'BT104',p:1},{s:'BT105',p:1},{s:'BT103L',p:2}],
            3:[{s:'BT101',p:1},{s:'BT202',p:1},{s:'BT103',p:1},{s:'BT104',p:1},{s:'BT105',p:1},{s:'BT104L',p:2}],
            4:[{s:'BT101',p:1},{s:'BT202',p:1},{s:'BT104',p:1},{s:'BT105',p:1},{s:'BT101L',p:2},{s:'ML',p:1}],
            5:[{s:'BT101',p:1},{s:'BT202',p:1},{s:'BT103',p:1},{s:'BT104',p:1},{s:'BT105',p:1},{s:'BT106',p:2}]
        }
    }
};

let curSec = null, attData = {};

function toggleTheme() {
    const isL = document.body.classList.toggle('light');
    localStorage.setItem('theme', isL ? 'light' : 'dark');
}

function selectSection(sec) {
    curSec = sec;
    localStorage.setItem('cur_sec', sec);
    attData = JSON.parse(localStorage.getItem(SECTIONS[sec].key) || '{}');
    document.getElementById('section-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('sec-label').innerText = SECTIONS[sec].label;
    document.getElementById('date-picker').value = new Date().toISOString().split('T')[0];
    const f = document.getElementById('sub-filter'); f.innerHTML = '';
    Object.keys(SECTIONS[sec].subjects).forEach(k => {
        const o = document.createElement('option'); o.value = k; o.innerText = SECTIONS[sec].subjects[k].name; f.appendChild(o);
    });
    renderOverview();
}

function changeSection() { document.getElementById('section-screen').style.display = 'flex'; document.getElementById('app').style.display = 'none'; }

function switchTab(id, el) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('tab-'+id).classList.add('active'); el.classList.add('active');
    if(id==='overview') renderOverview();
    if(id==='skip') renderSkipCalc();
    if(id==='logs') renderLogs();
}

function loadDay() {
    const d = document.getElementById('date-picker').value;
    const dow = new Date(d+'T00:00:00').getDay();
    const isH = dow===0 || dow===6 || HOLIDAYS.includes(d);
    document.getElementById('day-ui').style.display = isH ? 'none' : 'block';
    document.getElementById('holiday-msg').style.display = isH ? 'block' : 'none';
    if(isH) return;
    const list = document.getElementById('period-list'); list.innerHTML = '';
    const periods = SECTIONS[curSec].tt[dow] || [];
    periods.forEach((p, i) => {
        const s = (attData[d] || {})[i], div = document.createElement('div');
        div.className = 'period-item';
        div.innerHTML = `<div><b>${SECTIONS[curSec].subjects[p.s].name}</b><br><small>${p.p} class(es)</small></div>
            <div class="tog-grp" data-idx="${i}"><button class="tog-btn p ${s===true?'active':''}" onclick="setT(this)">P</button>
            <button class="tog-btn a ${s===false?'active':''}" onclick="setT(this)">A</button>
            <button class="tog-btn r ${s===undefined?'active':''}" onclick="setT(this)">—</button></div>`;
        list.appendChild(div);
    });
}

function setT(el) { el.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active')); el.classList.add('active'); }

function saveAtt() {
    const d = document.getElementById('date-picker').value, day = {};
    document.querySelectorAll('.tog-grp').forEach(g => {
        if(g.querySelector('.p').classList.contains('active')) day[g.dataset.idx]=true;
        else if(g.querySelector('.a').classList.contains('active')) day[g.dataset.idx]=false;
    });
    attData[d] = day; localStorage.setItem(SECTIONS[curSec].key, JSON.stringify(attData));
    alert('Saved!'); switchTab('overview', document.querySelectorAll('.nav-item')[0]);
}

function calcStats() {
    const st = {}; Object.keys(SECTIONS[curSec].subjects).forEach(k => st[k]={a:0,h:0});
    Object.keys(attData).forEach(d => {
        const sch = SECTIONS[curSec].tt[new Date(d+'T00:00:00').getDay()]; if(!sch) return;
        Object.keys(attData[d]).forEach(i => { const p = sch[i]; if(p) { st[p.s].h += p.p; if(attData[d][i]) st[p.s].a += p.p; } });
    });
    return st;
}

function renderOverview() {
    if(!curSec) return;
    const st = calcStats(), sub = SECTIONS[curSec].subjects;
    let tA=0, tH=0; Object.keys(sub).forEach(k => { tA+=st[k].a; tH+=st[k].h; });
    const p = tH>0 ? Math.round(tA/tH*100) : 0;
    const goal = Object.values(sub).reduce((a,b)=>a+b.total,0);
    document.getElementById('stat-grid').innerHTML = `<div class="stat-card"><span class="stat-label">Goal</span><span class="stat-val">${goal}</span></div>
        <div class="stat-card"><span class="stat-label">Overall</span><span class="stat-val" style="color:${p>=75?'var(--success)':'var(--danger)'}">${p}%</span></div>
        <div class="stat-card"><span class="stat-label">Held</span><span class="stat-val">${tH}</span></div><div class="stat-card"><span class="stat-label">Attended</span><span class="stat-val">${tA}</span></div>`;
    const cont = document.getElementById('subject-cards-container'); cont.innerHTML = '';
    Object.keys(sub).forEach(k => {
        const perc = st[k].h>0 ? Math.round(st[k].a/st[k].h*100) : 0;
        const card = document.createElement('div'); card.className = 'card';
        card.innerHTML = `<div class="subj-hdr"><div><b>${sub[k].name}</b><br><small>Held: ${st[k].h} | Total: ${sub[k].total}</small></div><span class="tag ${sub[k].type==='Theory'?'tag-theory':'tag-lab'}">${sub[k].type}</span></div>
            <div class="prog-wrap"><div class="prog-bar" style="width:${perc}%;background:${perc>=75?'var(--success)':'var(--danger)'}"></div></div>
            <div style="display:flex;justify-content:space-between;font-size:0.8rem;"><span style="color:${perc>=75?'var(--success)':'var(--danger)'}">${perc}%</span><span>Goal: ${Math.ceil(sub[k].total*0.75)}</span></div>`;
        cont.appendChild(card);
    });
}

function renderSkipCalc() {
    if(!curSec) return;
    const st = calcStats(), sub = SECTIONS[curSec].subjects, cont = document.getElementById('skip-container');
    cont.innerHTML = '<h2 style="font-size:1.1rem;margin-bottom:15px;">Safety Check</h2>';
    Object.keys(sub).forEach(k => {
        if(!sub[k].req75) return;
        const req = Math.ceil(0.75*sub[k].total), rem = sub[k].total - st[k].h, canM = Math.max(0,(st[k].a+rem)-req);
        const alert = (st[k].a+rem < req) ? `<div class="alert-box alert-danger">Shortage</div>` : (canM>0 ? `<div class="alert-box alert-safe">Skip ${canM} classes</div>` : `<div class="alert-box alert-danger">Must Attend</div>`);
        const card = document.createElement('div'); card.className = 'card';
        card.innerHTML = `<b>${sub[k].name}</b><div style="font-size:0.8rem;margin:5px 0;">Need: ${req} | Max Bunk: ${canM}</div>${alert}`;
        cont.appendChild(card);
    });
}

function renderLogs() {
    const k = document.getElementById('sub-filter').value, b = document.getElementById('log-body'); b.innerHTML = '';
    Object.keys(attData).sort().reverse().forEach(d => {
        const sch = SECTIONS[curSec].tt[new Date(d+'T00:00:00').getDay()]; if(!sch) return;
        sch.forEach((p, i) => {
            if(p.s === k && attData[d][i] !== undefined) {
                const r = document.createElement('tr');
                r.innerHTML = `<td>${d}</td><td>${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(d+'T00:00:00').getDay()]}</td><td>${p.p}</td><td style="color:${attData[d][i]?'var(--green)':'var(--danger)'}">${attData[d][i]?'P':'A'}</td>`;
                b.appendChild(r);
            }
        });
    });
}

window.onload = () => { if(localStorage.getItem('theme')==='light') document.body.classList.add('light'); const s = localStorage.getItem('cur_sec'); if(s) selectSection(s); };
</script>
</body>
</html>
